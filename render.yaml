services:
  - type: web
    name: skylant-portal-dashboard-api
    runtime: node
    plan: free
    rootDir: skylant-admin-portal/skylant-admin-portal/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://www.skylanttech.com,https://skylanttech.com,https://skylant-portal-dashboard.onrender.com
      - key: PORTAL_URL
        value: https://skylant-portal-dashboard.onrender.com
  - type: web
    name: skylant-portal-dashboard
    runtime: static
    rootDir: skylant-admin-portal/skylant-admin-portal/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skylant-portal-dashboard-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
